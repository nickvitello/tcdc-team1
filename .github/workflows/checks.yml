name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/regression_round2.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash -n boot.sh linux/harden.sh linux/watch-agent.sh tests/linux-install.sh linux/timecapsule.sh linux/fleet.sh linux/aide.sh linux/etckeeper.sh wazuh-agentless/checks/*.sh wazuh-agentless/tcdc-register.sh
      - name: Disposable Linux install and systemd smoke test
        run: sudo --preserve-env=GITHUB_ACTIONS bash tests/linux-install.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/regression_round2.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Windows PowerShell 5.1 parsing and fixture behavior
        shell: powershell
        run: ./tests/windows.ps1
      - name: Disposable Windows install and SYSTEM task smoke test
        shell: powershell
        run: ./tests/windows-install.ps1
